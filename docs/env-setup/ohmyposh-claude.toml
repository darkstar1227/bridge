version = 4

[[blocks]]
  type = "prompt"
  alignment = "left"

  [[blocks.segments]]
    type = "claude"
    style = "powerline"
    powerline_symbol = ""
    leading_diamond = ""
    foreground = "p:white"
    background = "p:blue"
    template = " \U000f0bc9 {{ .Model.DisplayName }} "

  [[blocks.segments]]
    type = "path"
    style = "powerline"
    powerline_symbol = ""
    foreground = "p:white"
    background = "p:orange"
    template = "  {{ path .Path .Location }} "
    [blocks.segments.options]
      style = "folder"

  [[blocks.segments]]
    type = "git"
    style = "powerline"
    powerline_symbol = ""
    foreground = "p:white"
    background = "p:purple"
    background_templates = [
      "{{ if or (.Working.Changed) (.Staging.Changed) }}p:yellow{{ end }}",
      "{{ if gt .Ahead 0 }}p:teal{{ end }}",
      "{{ if gt .Behind 0 }}p:red{{ end }}",
    ]
    foreground_templates = [
      "{{ if or (.Working.Changed) (.Staging.Changed) }}p:black{{ end }}",
    ]
    template = " {{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }} "
    [blocks.segments.options]
      fetch_status = true

  [[blocks.segments]]
    type = "claude"
    style = "powerline"
    powerline_symbol = ""
    trailing_diamond = ""
    foreground = "p:black"
    background = "p:yellow"
    background_templates = [
      "{{ if gt .TokenUsagePercent 50 }}p:red{{ end }}",
    ]
    foreground_templates = [
      "{{ if gt .TokenUsagePercent 50 }}p:white{{ end }}",
    ]
    template = " \U000f0954 {{ .TokenUsagePercent }}% "

[palette]
  black  = "#2B2118"
  white  = "#FBF1E6"
  orange = "#F07623"
  purple = "#B5794E"
  teal   = "#3B8686"
  yellow = "#F3AE35"
  blue   = "#4B95E9"
  red    = "#D81E5B"
  rose   = "#E8A87C"
